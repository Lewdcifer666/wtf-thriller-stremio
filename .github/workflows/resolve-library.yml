name: Resolve Library Metadata
on:
  push:
    branches: [main]
    paths: ['data/library.json', 'scripts/resolve-library.mjs', 'scripts/cinemeta.mjs']
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: repository-publication
  cancel-in-progress: false
jobs:
  resolve:
    if: github.ref == 'refs/heads/main' && vars.RESEARCH_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: publication
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - id: prepare
        run: node scripts/publish-research.mjs prepare-maintenance "$RUNNER_TEMP/metadata-bundle"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        if: steps.prepare.outputs.ready == 'true'
        id: app
        with:
          client-id: ${{ vars.PUBLICATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLICATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - if: steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/publish-research.mjs publish-maintenance "$RUNNER_TEMP/metadata-bundle"
