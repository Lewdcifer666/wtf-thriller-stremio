name: Resolve Library Metadata

on:
  push:
    branches: [main]
    paths:
      - "data/library.json"
      - "scripts/resolve-library.mjs"
      - "scripts/cinemeta.mjs"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve missing IMDb IDs and deduplicate
        run: node scripts/resolve-library.mjs

      - name: Validate library
        run: node scripts/validate.mjs

      - name: Commit resolved metadata if changed
        run: |
          if git diff --quiet; then
            echo "No metadata changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/library.json
          git commit -m "Resolve IMDb metadata and deduplicate library"
          git push
