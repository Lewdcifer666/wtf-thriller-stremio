name: Build and Deploy Stremio Catalog

on:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "config/**"
      - "scripts/**"
      - "package.json"
      - "DAILY_AUTOMATION_RUNBOOK.md"
      - ".github/workflows/deploy-pages.yml"

  schedule:
    # Rebuild hourly so items automatically leave
    # the Past 24h catalogs after 24 hours.
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Repair duplicate discoveries introduced by this push
        if: github.event_name == 'push'
        env:
          ADDED_FILES: ${{ toJSON(github.event.head_commit.added) }}
          MODIFIED_FILES: ${{ toJSON(github.event.head_commit.modified) }}
        run: node scripts/repair-push-duplicates.mjs

      - name: Commit automatic duplicate repair
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- data/discoveries data/discovery-log.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/discoveries data/discovery-log.json
            git commit -m "Auto-repair duplicate discovery before validation"
            git push origin HEAD:main
          fi

      - name: Check automation state
        run: node scripts/automation-preflight.mjs self-test

      - name: Validate source data
        run: node scripts/validate.mjs

      - name: Build static Stremio site
        run: node scripts/build-site.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
