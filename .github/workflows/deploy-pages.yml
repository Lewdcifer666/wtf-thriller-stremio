name: Build and Deploy Stremio Catalog

on:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "!data/automation-state.json"
      - "config/**"
      - "scripts/**"
      - "package.json"
      - "DAILY_AUTOMATION_RUNBOOK.md"
      - ".github/workflows/deploy-pages.yml"

  schedule:
    # Rebuild hourly so items automatically leave
    # the Past 24h catalogs after 24 hours.
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Repair duplicate discoveries introduced by this push
        if: github.event_name == 'push'
        env:
          ADDED_FILES: ${{ toJSON(github.event.head_commit.added) }}
          MODIFIED_FILES: ${{ toJSON(github.event.head_commit.modified) }}
        run: node scripts/repair-push-duplicates.mjs

      - name: Commit automatic duplicate repair
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- data/discoveries data/run-logs data/discovery-log.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/discoveries data/run-logs data/discovery-log.json
            git commit -m "Auto-repair duplicate discovery before validation"
            git push origin HEAD:main
          fi

      - name: Check automation state
        id: automation_check
        continue-on-error: true
        run: node scripts/automation-preflight.mjs self-test

      - name: Validate source data
        id: source_validation
        continue-on-error: true
        run: node scripts/validate.mjs

      - name: Build static Stremio site
        id: build_site
        continue-on-error: true
        run: node scripts/build-site.mjs

      - name: Validate immutable run logs
        id: run_log_validation
        continue-on-error: true
        run: node scripts/validate-run-logs.mjs

      - name: Evaluate repository checks
        id: repository_checks
        if: always()
        shell: bash
        run: |
          critical=0
          if [[ "${{ steps.automation_check.outcome }}" == "failure" ]]; then
            echo "::error::Automation-state validation failed."
            critical=1
          fi
          if [[ "${{ steps.source_validation.outcome }}" == "failure" ]]; then
            echo "::error::Source-data validation failed."
            critical=1
          fi
          if [[ "${{ steps.build_site.outcome }}" == "failure" ]]; then
            echo "::error::Static site build failed."
            critical=1
          fi
          if [[ "${{ steps.run_log_validation.outcome }}" == "failure" ]]; then
            echo "::warning::Run-log metadata validation failed. This is operational metadata only and will not block the catalog deployment."
          fi

          if [[ "$critical" == "1" ]]; then
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.event_name }}" == "schedule" ]]; then
              echo "::warning::Scheduled refresh found an already-broken repository state. Suppressing a repeated failure; the original push remains the actionable failure."
              exit 0
            fi
            exit 1
          fi

          echo "can_deploy=true" >> "$GITHUB_OUTPUT"

      - name: Refresh compact automation state
        if: steps.repository_checks.outputs.can_deploy == 'true'
        run: node scripts/export-automation-state.mjs data/automation-state.json

      - name: Commit refreshed automation state
        if: steps.repository_checks.outputs.can_deploy == 'true'
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- data/automation-state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/automation-state.json
            git commit -m "Refresh compact automation state"
            if ! git push origin HEAD:main; then
              echo "::warning::Could not push refreshed automation state; a later scheduled run will retry."
            fi
          fi

      - name: Configure GitHub Pages
        id: configure_pages
        if: steps.repository_checks.outputs.can_deploy == 'true'
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: upload_pages
        if: steps.repository_checks.outputs.can_deploy == 'true' && steps.configure_pages.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        if: steps.repository_checks.outputs.can_deploy == 'true' && steps.upload_pages.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before Pages retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Retry GitHub Pages deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before final Pages retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 45

      - name: Final GitHub Pages deployment retry
        id: deployment_final
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Evaluate Pages deployment
        if: always() && steps.repository_checks.outputs.can_deploy == 'true'
        shell: bash
        run: |
          if [[ "${{ steps.deployment.outcome }}" == "success" || "${{ steps.deployment_retry.outcome }}" == "success" || "${{ steps.deployment_final.outcome }}" == "success" ]]; then
            echo "Pages deployment succeeded."
            exit 0
          fi

          echo "::warning::GitHub Pages infrastructure did not complete this deployment. Treating it as non-fatal; the next hourly refresh will retry automatically."
          exit 0
