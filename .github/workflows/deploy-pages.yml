name: Build and Deploy Stremio Catalog

on:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "!data/automation-state.json"
      - "config/**"
      - "scripts/**"
      - "test/**"
      - "package.json"
      - "DAILY_AUTOMATION_PROMPT.md"
      - "DAILY_AUTOMATION_RUNBOOK.md"
      - ".github/workflows/deploy-pages.yml"

  pull_request:
    branches:
      - main

  schedule:
    # Rebuild hourly so items automatically leave
    # the Past 24h catalogs after 24 hours.
    - cron: "52 * * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        id: setup_node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # Validate the same deterministic repair that the deploy job will commit.
      # Pull requests never repair or write production data back to GitHub.
      - name: Repair duplicate discoveries introduced by this push
        if: github.event_name == 'push'
        env:
          ADDED_FILES: ${{ toJSON(github.event.head_commit.added) }}
          MODIFIED_FILES: ${{ toJSON(github.event.head_commit.modified) }}
        run: node scripts/repair-push-duplicates.mjs

      - name: Check automation state
        if: ${{ !cancelled() && steps.setup_node.outcome == 'success' }}
        run: node scripts/automation-preflight.mjs self-test

      - name: Validate source data
        if: ${{ !cancelled() && steps.setup_node.outcome == 'success' }}
        run: node scripts/validate.mjs

      - name: Validate immutable run logs
        if: ${{ !cancelled() && steps.setup_node.outcome == 'success' }}
        run: node scripts/validate-run-logs.mjs

      - name: Run full test suite
        if: ${{ !cancelled() && steps.setup_node.outcome == 'success' }}
        run: npm test

      - name: Build static Stremio site
        run: node scripts/build-site.mjs

      - name: Upload validated Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}

    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Repair duplicate discoveries introduced by this push
        if: github.event_name == 'push'
        env:
          ADDED_FILES: ${{ toJSON(github.event.head_commit.added) }}
          MODIFIED_FILES: ${{ toJSON(github.event.head_commit.modified) }}
        run: node scripts/repair-push-duplicates.mjs

      - name: Refresh compact automation state
        run: node scripts/export-automation-state.mjs data/automation-state.json

      - name: Commit validated repairs and refreshed automation state
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "::error::Main changed after validation. Rerun this workflow on the latest main; refusing to publish a stale snapshot."
            exit 1
          fi

          if [[ -n "$(git status --porcelain -- data/discoveries data/run-logs data/discovery-log.json data/automation-state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/discoveries data/run-logs data/discovery-log.json data/automation-state.json
            git commit -m "Commit validated discovery repair and automation state"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before Pages retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Retry GitHub Pages deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before final Pages retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 45

      - name: Final GitHub Pages deployment retry
        id: deployment_final
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Require a successful Pages deployment
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [[ "${{ steps.deployment.outcome }}" == "success" || "${{ steps.deployment_retry.outcome }}" == "success" || "${{ steps.deployment_final.outcome }}" == "success" ]]; then
            echo "Pages deployment succeeded."
            exit 0
          fi

          echo "::error::GitHub Pages did not deploy the validated catalog."
          exit 1
