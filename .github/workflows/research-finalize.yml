name: Finalize Research
on:
  workflow_run:
    workflows: ['Research Intake']
    types: [completed]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
        description: Validate persisted packets without creating publication PRs
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: repository-publication
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.ref == 'refs/heads/main' &&
      (vars.RESEARCH_PUBLICATION_ENABLED == 'true' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'research/')))
    runs-on: ubuntu-latest
    outputs:
      trusted_sha: ${{ steps.prepare.outputs.trusted_sha }}
      ready: ${{ steps.prepare.outputs.ready }}
      failures: ${{ steps.prepare.outputs.failures }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-research.mjs prepare "$RUNNER_TEMP/publication-bundle"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: publication-bundle
          path: ${{ runner.temp }}/publication-bundle
          if-no-files-found: error
  publish:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true' && vars.RESEARCH_PUBLICATION_ENABLED == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    environment: publication
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.trusted_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      # Downloads only this trusted workflow run's output, never intake artifacts.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: publication-bundle
          path: ${{ runner.temp }}/publication-bundle
      - run: node scripts/publish-research.mjs verify-bundle "$RUNNER_TEMP/publication-bundle"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app
        with:
          client-id: ${{ vars.PUBLICATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLICATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/publish-research.mjs publish "$RUNNER_TEMP/publication-bundle"
  report:
    needs: [prepare, publish]
    if: always() && needs.prepare.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          FAILURES: ${{ needs.prepare.outputs.failures }}
        run: |
          if [[ "$PREPARE_RESULT" != success || "$PUBLISH_RESULT" == failure || "${FAILURES:-0}" != 0 ]]; then
            echo '::error::Unresolved research or deployment work remains. Inspect the persisted bundle; hourly reconciliation will retry.'
            exit 1
          fi
